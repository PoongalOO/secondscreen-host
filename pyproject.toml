[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "secondscreen-host"
version = "0.1.0"
description = "Configure un écran virtuel 1280x800 et un serveur VNC (x11vnc) pour SecondScreen."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
# PyGObject n'est volontairement pas listé ici : sur Ubuntu et MX Linux, on
# l'installe via les paquets système (python3-gi, gir1.2-gtk-3.0), pas via
# pip — voir README.md, section Installation, et AGENTS.md, « Contraintes
# non négociables ».
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.6"]

[project.scripts]
secondscreen-host = "secondscreen_host.__main__:run"

[tool.setuptools.packages.find]
include = ["secondscreen_host*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
# Sélection explicite plutôt que le jeu par défaut de ruff (qui peut changer
# d'une version à l'autre) : pyflakes (F), pycodestyle (E), imports triés
# (I). E402 (import qui n'est pas en tête de fichier) est utile ici : GTK
# impose `gi.require_version(...)` avant `from gi.repository import ...`,
# ce que le code documente avec un `# noqa: E402` explicite plutôt que de
# désactiver la règle globalement.
select = ["E", "F", "I"]
